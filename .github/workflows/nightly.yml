name: nightly

# The full regression, across all three browser engines.
#
# Split from the pull-request gate on purpose. A PR gate answers "did I break
# something?" and must be fast enough that nobody routes around it. A nightly run
# answers "does it work everywhere?" and can afford to be thorough, because
# nobody is waiting on it.
#
# Chromium, Firefox and WebKit run as a matrix that does NOT fail fast: knowing a
# change breaks WebKit only is far more useful than knowing it broke "a browser".

on:
  schedule:
    # 02:30 UTC. Off the hour, because everybody schedules on the hour and the
    # queue is shorter five minutes later.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      browsers:
        description: "Browsers to run (JSON array)"
        required: false
        default: '["chromium","firefox","webkit"]'

env:
  PYTHON_VERSION: "3.12"

jobs:
  regression:
    name: regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_ENV: ci
      BASE_URL: http://127.0.0.1:8000
      DB_ENABLED: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: claimdesk
      DB_USER: claimdesk_qa_ro
      APP_DB_USER: claimdesk_app
      READINESS_TIMEOUT_SECONDS: "90"
      SEED_USER_PASSWORD: "Passw0rd!seed"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Generate ephemeral credentials
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APP_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APP_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install the framework and the application
        run: pip install -e ".[dev,app]"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pyproject.toml') }}

      - name: Install browser system libraries
        run: playwright install-deps ${{ matrix.browser }}

      - name: Install ${{ matrix.browser }}
        run: playwright install ${{ matrix.browser }}

      - name: Create the database and its two roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/setup_ci_db.sh

      - name: Start ClaimDesk
        run: |
          nohup python -m uvicorn claimdesk.main:app --app-dir app \
            --host 127.0.0.1 --port 8000 > app.log 2>&1 &

      - name: Full regression on ${{ matrix.browser }}
        run: |
          pytest -q -n 2 \
            --browser ${{ matrix.browser }} \
            --junitxml=junit-${{ matrix.browser }}.xml \
            --alluredir=allure-results

      - name: Application log
        if: failure()
        run: tail -n 200 app.log || echo "(the application never started)"

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artefacts-${{ matrix.browser }}
          path: |
            artifacts/
            app.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.browser }}
          path: |
            junit-${{ matrix.browser }}.xml
            allure-results/
          retention-days: 30
          if-no-files-found: warn

  publish:
    # One published report, from the Chromium run. Publishing three would
    # overwrite each other at the same URL and the last one to finish would
    # decide what the link showed - which is worse than not publishing, because
    # the page would look authoritative and be arbitrary.
    name: publish the Allure report
    runs-on: ubuntu-latest
    needs: regression
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the Chromium results
        uses: actions/download-artifact@v4
        with:
          name: results-chromium
          path: .

      - name: Restore the report history
        # History lives in the RESULTS directory when generating and is produced
        # into the report. Restoring it from the published branch is what turns a
        # snapshot into a trend - without it every nightly report claims to be
        # the first run that ever happened.
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 || exit 0
          git checkout origin/gh-pages -- history 2>/dev/null || exit 0
          mkdir -p allure-results
          cp -r history allure-results/history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the report
        run: |
          npm install -g allure-commandline
          ./scripts/report.sh --no-open

      # Allure emits `<title>Allure Report</title>` and no viewport meta, so the
      # published page is anonymous in a browser tab and renders at desktop width
      # on a phone. Both are fixed here rather than in scripts/report.sh, because
      # only the published copy needs it and the CLI rewrites index.html on every
      # generate. The greps are assertions: if Allure changes its template, this
      # step fails loudly instead of silently publishing an unpatched page.
      - name: Make the published report titled and mobile-readable
        run: |
          set -euo pipefail
          index=allure-report/index.html
          sed -i 's|<title>Allure Report</title>|<title>ClaimDesk QA - test report</title>|' "$index"
          sed -i 's|<head>|<head><meta name="viewport" content="width=device-width, initial-scale=1">|' "$index"
          grep -q 'ClaimDesk QA - test report' "$index"
          grep -q 'width=device-width' "$index"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          # keep_files is off: the report is a complete site each time, and
          # leaving orphaned files from previous layouts is how a published
          # report starts serving a stale index.
          keep_files: false
