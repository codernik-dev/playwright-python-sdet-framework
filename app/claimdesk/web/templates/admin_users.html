{% extends "base.html" %}
{% block title %}Users - ClaimDesk{% endblock %}
{% block content %}
<h1 data-testid="page-title">Users</h1>
<table data-testid="users-table">
  <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr></thead>
  <tbody>
    {% for u in users %}
    <tr data-testid="user-row" data-email="{{ u.email }}">
      <td>{{ u.email }}</td>
      <td>{{ u.full_name }}</td>
      <td><span class="chip">{{ u.role }}</span></td>
      <td data-testid="user-active">{{ "yes" if u.is_active else "no" }}</td>
      <td>
        {% if u.id != user.id %}
        <form method="post" action="/admin/users/{{ u.id }}/toggle" style="margin:0">
          <button type="submit" class="secondary" data-testid="toggle-user">
            {{ "Deactivate" if u.is_active else "Activate" }}
          </button>
        </form>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
